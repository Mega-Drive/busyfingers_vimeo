<!DOCTYPE html>
<html lang="en">
<head>
<title>Contact</title>
<!-- <link rel="icon" href="images/favicon.png"> -->
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="description" content="busyfingers project - AI video production">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" type="text/css" href="styles/bootstrap-5.3.8/bootstrap.min.css">
<link rel="stylesheet" type="text/css" href="styles/contact.css">
<link rel="stylesheet" type="text/css" href="styles/contact_responsive.css">
</head>
<body>

<div class="super_container">

	<!-- MENU -->
	<nav class="menu trans_200">
		<div class="menu_inner d-flex flex-column align-items-center">
			<div class="menu_header_inner d-flex flex-row align-items-center justify-content-between">
				<div class="header-logo">
					<a href="#" class="d-flex flex-row align-items-center"><img src="images/logo_white.svg" alt="" aria-hidden="true"><span>busyfingers</span></a>
				</div>
				<!-- Hamburger -->
				<div class="menu_close">
					<button class="close">
						<span class="d-flex flex-column align-items-center justify-content-center">
							<span></span>
							<span></span>
						</span>
					</button>
				</div>
			</div>
			<div class="menu_nav">
				<ul class="d-flex flex-column align-items-center justify-content-center">
					<li><a href="index.html#about">About</a></li>
					<li><a href="index.html#services">Services</a></li>
					<li><a href="index.html#work">Work</a></li>
					<li><a href="index.html#faq">FAQ</a></li>
					<li><a href="index.html#connect">Connect</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- HEADER -->
	<header class="header dark" id="header">
		<div class="header_inner d-flex flex-row align-items-center justify-content-between">
			<div class="header-logo">
                <a href="#" class="d-flex flex-row align-items-center"><img src="images/logo_white.svg" alt="" aria-hidden="true"><span>busyfingers</span></a>
            </div>
			<div class="header_content d-flex flex-row align-items-center">
				<!-- Hamburger -->
				<div class="hamburger_container">
					<button class="hamburger">
						<span></span>
						<span></span>
						<span></span>
					</button>
				</div>
			</div>
		</div>
	</header>

	<!-- MAIN CONTENT -->
	<main>
		<section class="contact" id="contact">
			<div class="container">
				<div class="row">
					<div class="col-xl-6 col-lg-8 offset-xl-3 offset-lg-2">
						<h1 class="contact_title text-center">Get in touch</h1>
						<div class="contact_form_container">
							<form action="#" class="contact_form" id="contact_form">
								<div class="d-flex flex-row">
									<label for="contact_input_last_name" class="visually-hidden">Last Name</label>
									<input type="text" name="last_name" class="contact_input" id="contact_input_last_name" placeholder="Last Name" required>
									<label for="contact_input_first_name" class="visually-hidden">First Name</label>
									<input type="text" name="first_name" class="contact_input" id="contact_input_first_name" placeholder="First Name" required>
								</div>
								<label for="contact_input_email" class="visually-hidden">Email</label>
								<input type="email" name="email" class="contact_input" id="contact_input_email" placeholder="Email" required>
								<label for="contact_input_phone" class="visually-hidden">Phone</label>
								<input type="tel" name="phone" class="contact_input" id="contact_input_phone" placeholder="Phone Number" required>
								<label for="contact_textarea" class="visually-hidden">Message</label>
								<textarea name="message" class="contact_textarea" id="contact_textarea" placeholder="Message" required></textarea>
								<button class="contact_button" id="contact_button" type="submit">Send it</button>
							</form>
							<p class="form-status"></p>
						</div>
					</div>
				</div>
			</div>
		</section>
	</main>

	<!-- FOOTER -->
	<footer class="footer light-theme">
			
	</footer>

</div>

<!-- Core libraries -->
<script src="js/jquery-3.7.1.min.js" defer></script>
<script src="styles/bootstrap-5.3.8/popper.js" defer></script>
<script src="styles/bootstrap-5.3.8/bootstrap.min.js" defer></script>

<!-- Plugins -->

<!-- Custom logic -->
<script src="js/contact.js" defer></script>
</body>
</html>
